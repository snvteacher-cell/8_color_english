<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кольорова англійська</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Nunito:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#eef2ec; --surface:#ffffff; --fg:#1d2a24; --muted:#5c6b63; --line:#cfd9d2;
  --board:#1f6b4a; --board-soft:#dcebe2; --copper:#b8681c; --copper-soft:#f6e6d2;
  --gold:#c98a00; --gold-soft:#fbf0d3;
  --ok:#1f8a4c; --bad:#c2412d; --ok-soft:#dff1e6; --bad-soft:#f8e1dc;
  --code-bg:#f7faf8; --kw:#c25e00; --st:#1d8a3a; --fn:#2456c9; --bi:#8a3fc2; --cm:#8a9a91;
  --display:"Unbounded","Trebuchet MS",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a16; --surface:#1a2620; --fg:#e6efe9; --muted:#9fb1a7; --line:#2d3d35;
  --board:#4fbf8a; --board-soft:#1f3a2d; --copper:#e3a35d; --copper-soft:#3a2b1a;
  --gold:#ffc94d; --gold-soft:#3a2f12;
  --ok:#56c98a; --bad:#ef7a64; --ok-soft:#1d3a2a; --bad-soft:#3f231e;
  --code-bg:#14201a; --kw:#ffab5c; --st:#7fd88f; --fn:#8fb4ff; --bi:#d39cff; --cm:#6f8378; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a16; --surface:#1a2620; --fg:#e6efe9; --muted:#9fb1a7; --line:#2d3d35;
  --board:#4fbf8a; --board-soft:#1f3a2d; --copper:#e3a35d; --copper-soft:#3a2b1a;
  --gold:#ffc94d; --gold-soft:#3a2f12;
  --ok:#56c98a; --bad:#ef7a64; --ok-soft:#1d3a2a; --bad-soft:#3f231e;
  --code-bg:#14201a; --kw:#ffab5c; --st:#7fd88f; --fn:#8fb4ff; --bi:#d39cff; --cm:#6f8378; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.5;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 40px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.25rem,3.4vw,2rem);line-height:1.15;margin:0;text-wrap:balance}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 14px}
.tab{font:inherit;font-weight:800;font-size:.95rem;padding:6px 14px 6px 6px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:flex;align-items:center;gap:8px}
.tab b{font-family:var(--display);font-weight:500;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-size:.85rem}
.tab[aria-selected="true"]{background:var(--board);border-color:var(--board);color:var(--surface)}
.tab[aria-selected="true"] b{border-color:var(--surface)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--copper);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(14px,2.6vw,24px)}
h2{font-family:var(--display);font-weight:500;font-size:1.2rem;margin:0 0 12px;text-wrap:balance}
.h2n{font-family:var(--body);font-weight:600;font-size:.92rem;color:var(--muted)}
h3{font-family:var(--display);font-weight:500;font-size:1.05rem;margin:0 0 8px}
.btn{font:inherit;font-weight:800;font-size:1rem;padding:9px 16px;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;touch-action:manipulation}
.btn.main{background:var(--board);border-color:var(--board);color:var(--surface)}
.btn.sm{min-height:38px;padding:5px 12px;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:default}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pills button{font:inherit;font-weight:700;font-size:.95rem;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;display:flex;align-items:center;gap:6px}
.pills button[aria-pressed="true"]{border-color:var(--board);background:var(--board-soft)}
.pills .ck{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pills .done .ck{color:var(--ok);font-weight:800}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:1rem}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)} .fb.info{background:var(--gold-soft)}
.fb .ttl{font-weight:800;display:block}
.fb ul{margin:6px 0 0;padding-left:20px}
code{font-family:var(--mono);font-size:.92em}
.author{margin:16px 0 0;font-size:.75rem;color:var(--muted);opacity:.6;text-align:left}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-200px);visibility:hidden;transition:transform .35s;z-index:30;background:var(--gold);color:#1b1400;font-weight:800;padding:10px 18px;border-radius:99px;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translate(-50%,0);visibility:visible}

/* code */
.code{font-family:var(--mono);font-size:.9rem;background:var(--code-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;line-height:1.75;white-space:pre-wrap;word-break:break-word;margin:0}
.code .kw{color:var(--kw);font-weight:700} .code .st{color:var(--st)} .code .fn{color:var(--fn);font-weight:700} .code .bi{color:var(--bi)} .code .cm{color:var(--cm);font-style:italic}
.code .new{background:var(--gold-soft);outline:2px solid var(--gold);border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:1px 2px}
.code .tip{border-bottom:2px dotted var(--muted);cursor:help}
.tipbox{position:fixed;z-index:40;display:none;max-width:240px;background:#1d2a24;color:#fff;font-size:.85rem;line-height:1.35;padding:6px 10px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:none}
.code mark{background:var(--gold-soft);color:inherit;border-radius:4px;outline:2px solid var(--gold);padding:0 2px}

/* tkinter window */
.winbox{width:100%;display:flex;justify-content:center}
.win{border:1px solid #9aa5a0;border-radius:8px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12);background:#f0f0f0;color:#111;max-width:100%}
.win .tb{display:flex;align-items:center;gap:8px;padding:5px 8px;background:#fff;border-bottom:1px solid #ccc;font-family:"Segoe UI",system-ui,sans-serif;font-size:.85rem}
.win .tb svg{width:16px;height:16px;flex:none}
.win .tb .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win .tb .wc{letter-spacing:10px;color:#444;font-size:.9rem}
.wv{position:relative;overflow:hidden}
.wbody{position:absolute;left:0;top:0;transform-origin:0 0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:12px;transition:background-color .25s}
.wbody.grid{background-image:linear-gradient(rgba(0,0,0,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.1) 1px,transparent 1px);background-size:50px 50px}
.wbody .gl{position:absolute;font-style:normal;font-size:10px;color:#666;font-family:var(--mono)}
.wbody .wb{position:absolute;font-family:inherit;font-size:12px;padding:0 2px;border:2px outset #e4e4e4;background:#f0f0f0;color:#000;cursor:pointer;white-space:nowrap;overflow:hidden;line-height:22px;text-align:center;touch-action:manipulation}
.wbody .wb:active{border-style:inset}
.wbody .wl{position:absolute;background:#f0f0f0;line-height:21px;white-space:nowrap;padding:0 3px}
.wempty{padding:40px 12px;text-align:center;color:#777;font-size:.9rem}
.wmsg{position:absolute;inset:0;background:rgba(0,0,0,.25);display:grid;place-items:center}
.wmsg .box{background:#fff;border:1px solid #888;min-width:70%;max-width:92%;font-family:"Segoe UI",sans-serif;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.wmsg .bt{padding:4px 8px;border-bottom:1px solid #ddd}
.wmsg .bx{padding:14px 10px}
.wmsg .bf{background:#f0f0f0;padding:6px;text-align:right}
.wmsg .bf button{font:inherit;padding:2px 18px}
.console{margin-top:10px;background:#101814;color:#d6f5e3;border-radius:10px;padding:8px 10px;font-family:var(--mono);font-size:.8rem;min-height:60px;max-height:150px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.console .c{color:#7d978a;font-style:italic} .console .e{color:#ff8c7a} .console .m{color:#f0c36c}

/* explanation */
.sl-dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sl-dots button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-weight:800;font-size:.85rem;cursor:pointer;padding:0}
.sl-dots button.seen{border-color:var(--board)}
.sl-dots button.cur{background:var(--board);border-color:var(--board);color:var(--surface)}
.slide{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.slide h3{color:var(--board);font-size:1.1rem}
.slide p{margin:0 0 10px}
.note{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.note li{border-left:5px solid var(--board);background:var(--bg);border-radius:6px;padding:5px 10px;font-size:.95rem;line-height:1.4}
.note code{font-weight:700;color:var(--board)}
.try{margin-top:8px;font-weight:800;color:var(--copper);font-size:.95rem;text-align:center}
.ctl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.sw{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--copper);outline-offset:2px}

/* project */
.task{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:var(--board-soft);border-left:5px solid var(--board)}
.lab{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.code .blank{font:inherit;font-weight:700;min-width:5ch;min-height:28px;border:0;border-bottom:3px solid var(--copper);background:var(--copper-soft);border-radius:6px;padding:0 6px;color:var(--fg);cursor:pointer;touch-action:manipulation;vertical-align:baseline}
.code .blank.sel{outline:3px solid var(--board);outline-offset:1px}
.code .blank.ok{border-color:var(--ok);background:var(--ok-soft)}
.code .blank.no{border-color:var(--bad);background:var(--bad-soft)}
.bank{position:sticky;bottom:0;z-index:3;background:var(--surface);padding:10px 0 8px;display:flex;flex-wrap:wrap;gap:6px;border-top:1px dashed var(--line);margin-top:10px}
.bank button,.keys button{font-family:var(--mono);font-weight:700;font-size:.95rem;min-width:40px;min-height:40px;padding:4px 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;touch-action:manipulation}
.bank .lbl{flex-basis:100%;font-size:.85rem;color:var(--muted);font-weight:700}
.edwrap{display:grid;grid-template-columns:auto minmax(0,1fr);border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--code-bg)}
.gut{font-family:var(--mono);font-size:16px;line-height:1.55;padding:8px 6px;color:var(--cm);text-align:right;user-select:none;background:var(--bg);border-right:1px solid var(--line);white-space:pre;overflow:hidden}
.gut .el{background:var(--bad-soft);color:var(--bad);font-weight:800;display:inline-block;width:100%}
textarea.ed{font-family:var(--mono);font-size:16px;line-height:1.55;padding:8px 10px;border:0;resize:vertical;min-height:300px;background:transparent;color:var(--fg);white-space:pre;overflow:auto;tab-size:4;outline:none;width:100%}
.keys{position:sticky;bottom:0;z-index:3;background:var(--surface);padding:8px 0;display:flex;flex-wrap:wrap;gap:5px}
.keys button{min-width:38px;font-size:.95rem}
.keys .sn{font-family:var(--body);color:var(--board);border-color:var(--board)}
.keys .sw{width:40px;height:40px;min-width:0}
.err{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--bad-soft);border:2px solid var(--bad);font-size:.95rem}
.err .et{font-family:var(--mono);font-weight:700;color:var(--bad);display:block;word-break:break-word}
.err .ln{font-family:var(--mono);font-size:.85rem;background:var(--surface);border-radius:6px;padding:2px 6px;display:inline-block;margin:4px 0;white-space:pre-wrap}
.reqs{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:4px;font-size:.95rem}
.reqs li{padding:4px 10px;border-radius:8px;background:var(--bg)}
.reqs li.y{background:var(--ok-soft)} .reqs li.y::before{content:"✓ ";color:var(--ok);font-weight:800}
.reqs li.n{background:var(--bad-soft)} .reqs li.n::before{content:"✗ ";color:var(--bad);font-weight:800}
.reqs li.u::before{content:"○ ";color:var(--muted)}
.prtable{width:100%;border-collapse:collapse;font-size:1rem;margin:8px 0 14px}
.prtable td{border-bottom:1px solid var(--line);padding:6px}
.prtable td:last-child{text-align:right;font-weight:800;white-space:nowrap}
.namebox{display:grid;gap:8px;margin:0 0 6px;max-width:420px}
.namebox label{font-weight:800;display:grid;gap:4px}
.namebox input{font:inherit;font-size:16px;padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.scale{color:var(--muted);font-size:.92rem;margin:0}

.card{border:2px solid var(--board);border-radius:16px;padding:14px;background:var(--surface);margin-top:10px}
.cardhd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cardhd b{display:block;font-size:1.15rem}
.cardhd span{font-weight:800;color:var(--muted)}
.cardhd small{display:block;color:var(--muted);font-size:.85rem}
.grade{font-family:var(--display);font-weight:700;font-size:2.6rem;line-height:1;color:var(--board);text-align:center}
.grade small{display:block;font-family:var(--body);font-size:.8rem;color:var(--muted)}
.cardbody{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.code.small{font-size:.72rem;line-height:1.45;padding:8px}
@media (max-width:720px){.cardbody{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.slide,.lab{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){
  body{font-size:17px}
  .wrap{padding-block:12px calc(84px + env(safe-area-inset-bottom,0px))}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.07)}
  .tab{border:0;border-radius:12px;padding:5px 0;font-size:.75rem;font-weight:700;flex-direction:column;gap:2px;background:transparent;justify-content:center}
  .tab[aria-selected="true"]{background:var(--board-soft);color:var(--board)}
  .tab[aria-selected="true"] b{background:var(--board);border-color:var(--board);color:var(--surface)}
  body.typing .tabs{display:none}
  body:not(.typing) .bank,body:not(.typing) .keys{bottom:calc(68px + env(safe-area-inset-bottom,0px))}
  .panel{padding:14px 12px;border-radius:16px}
  .code{font-size:.82rem;padding:8px 10px}
  .pills{flex-wrap:nowrap;overflow-x:auto;margin-inline:-12px;padding:0 12px 4px}
  .pills button{flex:none}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Кольорова англійська</h1>

  <nav class="tabs" role="tablist" aria-label="Розділи">
    <button class="tab" role="tab" id="t-th" aria-controls="p-th" aria-selected="true"><b>1</b><span>Пояснення</span></button>
    <button class="tab" role="tab" id="t-pr" aria-controls="p-pr" aria-selected="false"><b>2</b><span>Проєкт</span></button>
    <button class="tab" role="tab" id="t-sd" aria-controls="p-sd" aria-selected="false"><b>3</b><span>Результат</span></button>
  </nav>

  <section class="panel" id="p-th" role="tabpanel" aria-labelledby="t-th">
    <h2>Пояснення <span class="h2n">(6 кроків: нове виділено рамкою і пояснено внизу; наведи чи натисни на підкреслену команду — буде підказка)</span></h2>
    <div class="sl-dots" id="slDots"></div>
    <div id="slide"></div>
    <div class="row-btns" style="justify-content:space-between"><button class="btn" id="slPrev">← Назад</button><button class="btn main" id="slNext">Далі →</button></div>
  </section>

  <section class="panel" id="p-pr" role="tabpanel" aria-labelledby="t-pr" hidden>
    <h2>Проєкт <span class="h2n">(мінімум — кроки 1 і 2: 6 балів; крок 3 — до 12)</span></h2>
    <div class="pills" id="prPills"></div>
    <div id="prBox"></div>
  </section>

  <section class="panel" id="p-sd" role="tabpanel" aria-labelledby="t-sd" hidden>
    <h2>Результат <span class="h2n">(для скріншота)</span></h2>
    <div id="sdBox"></div>
  </section>

  <p class="author">© Сидорчук Н.В.</p>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const TEACHER_EMAIL='snv.teacher@gmail.com';
const TITLE='Кольорова англійська (tkinter)';
const KEY='tk8btn-';
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const ls={get(k){try{return localStorage.getItem(KEY+k)}catch(e){return null}},set(k,v){try{localStorage.setItem(KEY+k,v)}catch(e){}}};
const isPhone=()=>window.matchMedia('(max-width:720px)').matches;
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2500)}

/* ---------- syntax highlight ---------- */
const KW=new Set(['from','import','def','for','in','return','if','else','while','True','False','None']);
const BI=new Set(['print','Button','Label','Tk','mainloop','messagebox']);
function hl(s){let out='',m,prevDef=false;const re=/("(?:[^"\\\n]|\\.)*"?|'(?:[^'\\\n]|\\.)*'?)|([A-Za-z_][A-Za-z0-9_]*)|(#.*)|([\s\S])/g;
  while((m=re.exec(s))){
    if(m[1]){out+=`<span class="st">${esc(m[1])}</span>`;prevDef=false}
    else if(m[2]){const w=m[2];
      if(KW.has(w)){out+=`<span class="kw">${w}</span>`;prevDef=w==='def';continue}
      out+=prevDef?`<span class="fn">${w}</span>`:BI.has(w)?`<span class="bi">${w}</span>`:esc(w);prevDef=false}
    else if(m[3])out+=`<span class="cm">${esc(m[3])}</span>`;
    else{out+=esc(m[4]);if(!/\s/.test(m[4]))prevDef=false}}
  return out}

/* =========================================================
   MINI PYTHON + tkinter (Tk, Button, Label, place, bind, window['bg'], messagebox)
   ========================================================= */
const PY=(()=>{
  class PyErr extends Error{constructor(type,msg,line,hint){super(msg);this.type=type;this.line=line;this.hint=hint}}
  const NONE=null;
  const OPTS=new Set(['text','bg','background','fg','foreground','width','height','command','font','padx','pady','activebackground','activeforeground','relief','bd','borderwidth','state','anchor','justify']);
  const CLICK=new Set(['<Button-1>','<1>','<ButtonPress-1>','<ButtonRelease-1>']);
  const SEQOK=/^<(Button-[1-3]|ButtonPress-[1-3]|ButtonRelease-[1-3]|[1-3]|Double-Button-1|Enter|Leave|Motion|Return|Key)>$/;
  function lev(a,b){const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];for(let j=1;j<=b.length;j++)d[i][j]=i?Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return d[a.length][b.length]}

          throw new PyErr('Підказка','метод згадано без дужок',n,`Щоб викликати метод, потрібні дужки: …${e.v}()`)}

          if(e.f.k==='attr')return method(ev(e.f.o,loc,n),e.f.v,a,kw,n);
          return call(ev(e.f,loc,n),a,kw,n)}}}
    function call(f,a,kw,n){
      if(f&&f.kind==='bi')return f.fn(a,kw,n);
      if(f&&f.kind==='fn'){const p=f.ps.length,ln=n||f.n;
        if(a.length>p)throw new PyErr('TypeError',`${f.name}() takes ${p} positional argument${p===1?'':'s'} but ${a.length} ${a.length===1?'was':'were'} given`,ln,p===0?`Функції, яку викликає bind, Python передає подію. Допиши в дужках слово event: def ${f.name} (event):`:'Забагато значень у дужках.');
        if(a.length<p)throw new PyErr('TypeError',`${f.name}() missing ${p-a.length} required positional argument: '${f.ps[a.length]}'`,ln,a.length===0?`Для command функцію пишуть з порожніми дужками: def ${f.name}():`:`Функцію в bind передають без дужок: …bind('<Button-1>', ${f.name})`);

      if(f&&(f.kind==='w'||f.kind==='tk'))throw new PyErr('TypeError',`'${typeName(f)}' object is not callable`,n,'Після імені кнопки чи вікна пишуть крапку й метод: knopka1.place(…)');

    function run(stmts,loc){for(const s of stmts){const n=s.n;
        switch(s.k){
          case'imp':if(s.w==='*'){for(const k in TK)G.set(k,TK[k])}else G.set('messagebox',MB);break;
          case'def':(loc||G).set(s.name,{kind:'fn',name:s.name,ps:s.ps,b:s.b,n:s.n});break;
          case'asg':(loc||G).set(s.v,ev(s.e,loc,n));break;
          case'setitem':{const o=lookup(s.o,loc,n),k=ev(s.key,loc,n),v=ev(s.e,loc,n);setItem(o,k,v,n);break}
          case'setattr':{const o=lookup(s.o,loc,n);ev(s.e,loc,n);if(o&&(o.kind==='w'||o.kind==='tk'))hooks.note(`# рядок ${n}: ${s.o}.${s.a} = … нічого не змінює. Пиши так: ${s.o}['${s.a}'] = …`);break}
          case'expr':ev(s.e,loc,n);break}}

    function click(w){let fired=false;
      for(const [sq,f] of Object.entries(w.binds))if(CLICK.has(sq)){fired=true;call(f,[{kind:'event',x:5,y:5,num:1,widget:w,type:'ButtonPress'}],{},0)}

      return fired}
    return{G,W,run,click,get root(){return root}}}
  return{PyErr,parse,make}})();

  rt.W.filter(w=>w.alive&&(w.packed||w.placed)).sort((a,b)=>a.ord-b.ord).forEach(w=>{

class Sim{
  constructor(el,opt){this.el=el;this.opt=opt||{};this.rt=null;this.msg=null;this.lines=[]}
  run(src){this.msg=null;this.lines=[];this.err=null;this.rt=null;
    const H={out:t=>this.log(t),render(){},note:t=>this.log(t,'c'),msg:(t,x,k)=>{this.msg={t,x,k}}};
    this.log('>>> програму запущено','c');
    let rt=null;try{const p=PY.parse(src);rt=PY.make(H);this.rt=rt;rt.run(p,null);if(!rt.root)this.log('# вікна немає: бракує рядка window = Tk()','c')}catch(e){this.fail(e)}

  log(t,c){this.lines.push([t,c]);if(this.lines.length>60)this.lines.shift();const el=this.opt.con&&$(this.opt.con);
    if(el){el.innerHTML=this.lines.map(([t,c])=>`<div${c?` class="${c}"`:''}>${esc(t)}</div>`).join('');el.scrollTop=1e6}}
  fail(e){if(!(e instanceof PY.PyErr))e=new PY.PyErr('Помилка',String(e&&e.message||e),0);this.err=e;this.log(`${e.line?'Рядок '+e.line+': ':''}${e.type}: ${e.message}`,'e');this.opt.onErr&&this.opt.onErr(e)}

    try{const f=this.rt.click(w);
      if(!f)this.log(`# «${txt(w).trim()}» нічого не робить: кнопку не пов’язано з функцією (бракує command=…)`,'c');

    catch(e){this.fail(e)}
    this.draw();this.opt.onClick&&this.opt.onClick(w)}
  draw(){const el=$(this.el);if(!el)return;el.innerHTML=winHTML(this.rt,{w:el.clientWidth,msg:this.msg,grid:this.opt.grid,empty:this.opt.empty});
    el.querySelectorAll('.wb').forEach(b=>b.onclick=()=>this.click(+b.dataset.id));
    const ok=el.querySelector('.wmsg button');if(ok)ok.onclick=()=>{this.msg=null;this.draw()}}}

function analyze(src){const r={err:null,btns:[],W:300,H:300};
  const H={out(){},render(){},note(){},msg(){}};let rt;
  try{rt=PY.make(H);rt.run(PY.parse(src),null)}catch(e){r.err=e;return r}
  if(!rt.root){r.err=new PY.PyErr('Тренажер','вікно не створено',0,'Створи вікно: window = Tk()');return r}
  r.W=rt.root.w;r.H=rt.root.h;const base=rt.root.o.bg;
  r.btns=layout(rt).items.filter(i=>i.w.type==='Button').map(i=>{rt.root.o.bg=base;let bg=null,err=null,fired=false;
    try{fired=rt.click(i.w);if(rt.root.o.bg!==base)bg=rt.root.o.bg}catch(e){err=e}
    return{text:txt(i.w).trim(),x:i.x,y:i.y,w:i.ww,h:i.hh,col:bg?norm(bg):null,err,fired}});
  return r}
function diag(r){const out=[];if(r.err)return out;const bs=r.btns;
  bs.forEach(b=>{const nm=b.text?`«${b.text}»`:'без напису';
    if(b.err)out.push(`Кнопка ${nm}: помилка після натискання — ${b.err.message}. ${b.err.hint||''}`);
    else if(!b.fired)out.push(`Кнопка ${nm} нічого не робить: допиши command=ім’я_функції (без дужок).`);
    else if(!b.col)out.push(`Кнопка ${nm} не змінює колір вікна.`);
    if(!b.text)out.push('Є кнопка без напису: допиши text=\'…\'.');
    else if(b.col&&norm(b.text)!==b.col)out.push(`Напис ${nm} не збігається з кольором: на кнопці має бути англійська назва кольору, яким вона фарбує.`);
    if(!inside(r,b))out.push(`Кнопка ${nm} вилазить за межі вікна ${r.W}×${r.H}: зменш x або y.`)});
  bs.forEach((a,i)=>bs.forEach((b,j)=>{if(j>i&&cross(a,b))out.push(`Кнопки «${a.text}» і «${b.text}» накладаються: зміни x або y.`);
    if(j>i&&a.col&&a.col===b.col)out.push(`Кнопки «${a.text}» і «${b.text}» дають однаковий колір.`)}));
  return [...new Set(out)]}

function snip(kind,src){const mx=re=>{let m,x=0;const r=new RegExp(re,'g');while((m=r.exec(src)))x=Math.max(x,+m[1]);return x};
  if(kind==='fn'){const k=mx('def\\s+clik(\\d+)')+1;return{t:`# функція кнопки\ndef clik${k}():\n    window['bg']=""\n`,cur:`window['bg']="`}}
  const k=mx('knopka(\\d+)\\s*=')+1,i=k-1,x=i%2?170:70,y=10+40*Math.floor(i/2);
  return{t:`# створює кнопку і пов'язує її з функцією\nknopka${k}=Button(window, text='', command=clik${k})\nknopka${k}.place(x=${x}, y=${y})\n`,cur:`text='`}}
function setupEd(){const ta=$('prEd');ta.value=PR.code[PR.i];
  const save=()=>{PR.code[PR.i]=ta.value;PR.errLine=0;prSave();gut()};
  ta.oninput=e=>{if(e.inputType==='insertLineBreak'&&!ta._k){const before=ta.value.slice(0,ta.selectionStart-1).split('\n').pop();let ind=before.match(/^ */)[0];if(/:\s*$/.test(before))ind+='    ';if(ind)ta.setRangeText(ind,ta.selectionStart,ta.selectionStart,'end')}ta._k=false;save()};
  ta.onscroll=()=>{$('prGut').scrollTop=ta.scrollTop};
  const ins=(t,curAfter)=>{const s=ta.selectionStart,e=ta.selectionEnd;ta.setRangeText(t,s,e,'end');
    if(curAfter!==undefined){const p=s+curAfter;ta.setSelectionRange(p,p)}save()};
  ta.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();ins('    ')}else if(e.key==='Enter'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();ta._k=true;const cur=ta.value.slice(0,ta.selectionStart).split('\n').pop();let ind=cur.match(/^ */)[0];if(/:\s*$/.test(cur))ind+='    ';ins('\n'+ind)}};
  const act=b=>{const k=b.dataset.k,s=b.dataset.s,c=b.dataset.c;
    if(k==='←'||k==='→'){const p=Math.max(0,ta.selectionStart+(k==='←'?-1:1));ta.setSelectionRange(p,p);return}
    if(k){ins(k==='⇥'?'    ':k);return}
    if(c){const v=ta.value,p=ta.selectionStart,inQ=/["']$/.test(v.slice(0,p))&&/^["']/.test(v.slice(ta.selectionEnd));ins(inQ?c:`"${c}"`);return}
    if(s){const sn=snip(s,ta.value);const p=ta.selectionStart,lineStart=ta.value.lastIndexOf('\n',p-1)+1,pre=p>lineStart?'\n':'';
      ins(pre+sn.t,pre.length+sn.t.indexOf(sn.cur)+sn.cur.length)}};
  $('keys').querySelectorAll('button').forEach(b=>{let moved=false;
    b.addEventListener('mousedown',e=>e.preventDefault());
    b.addEventListener('touchstart',()=>{moved=false},{passive:true});
    b.addEventListener('touchmove',()=>{moved=true},{passive:true});
    b.addEventListener('touchend',e=>{e.preventDefault();if(!moved)act(b)});
    b.addEventListener('click',()=>act(b))});
  gut()}
